name: Auto Sync & Build Multi-Arch PRoot Gemini

on:
  # 1. 每月 1 号 UTC 02:28 (北京时间 10:28) 自动拉取同步上游并检查构建
  schedule:
    - cron: '28 2 1 * *'

  # 2. 手动触发：支持指定版本号 (默认 v5.5.0) 立即构建并发布
  workflow_dispatch:
    inputs:
      release_tag:
        description: '指定发布的版本 Tag (留空则自动读取上游最新 Tag，如 v5.5.0)'
        required: false
        default: 'v5.5.0'
      force_build:
        description: '是否强制重新编译并覆盖发布该 Tag'
        type: boolean
        default: true

  # 3. 推送 v* 标签时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 消除 GitHub Actions Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 阶段 1：同步上游最新源码 & 智能计算版本标签
  # ==========================================
  sync-and-check:
    name: Sync Upstream & Check Version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_date: ${{ steps.check.outputs.upstream_date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream & Detect New Version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -e

          # 1. 获取本仓库当前已发布的最新 Release 信息
          LATEST_RELEASE_JSON=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName,body 2>/dev/null || echo "{}")
          LAST_TAG=$(echo "${LATEST_RELEASE_JSON}" | jq -r '.tagName // empty')
          LAST_BODY=$(echo "${LATEST_RELEASE_JSON}" | jq -r '.body // empty')
          echo "当前本仓库最新 Release Tag: ${LAST_TAG:-无}"

          # 2. 添加上游官方仓库并强制拉取最新源码与所有标签 (解决同名 Tag 冲突报错)
          git remote add upstream https://github.com/proot-me/proot.git 2>/dev/null || true
          git fetch upstream master --tags --force

          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          UPSTREAM_DATE=$(git log -1 --format=%cs upstream/master)
          echo "upstream_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          echo "upstream_date=${UPSTREAM_DATE}" >> $GITHUB_OUTPUT
          echo "上游最新 Commit: ${UPSTREAM_SHA} (${UPSTREAM_DATE})"

          # 3. 自动获取上游最新的正式版 Tag (例如 v5.5.0)
          UPSTREAM_TAG=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n 1 || true)
          if [ -z "${UPSTREAM_TAG}" ]; then
            UPSTREAM_TAG="v5.5.0"
          fi
          # 若上游 Tag 形如 v5.5，自动规范化补齐为 v5.5.0
          if [[ "${UPSTREAM_TAG}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            UPSTREAM_TAG="${UPSTREAM_TAG}.0"
          fi
          echo "检测到上游最新规范化 Tag: ${UPSTREAM_TAG}"

          # 4. 尝试将上游 master 同步合并到本仓库 master 分支
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout master 2>/dev/null || git checkout -b master
            if git merge upstream/master --no-edit; then
              git push origin master 2>/dev/null || echo "提示: 跳过分支推送，后续直接拉取上游最新源码编译"
            else
              git merge --abort 2>/dev/null || true
            fi
          fi

          # 5. 判定是否需要构建及最终发布的 Tag 名称
          SHOULD_BUILD="false"
          TARGET_TAG=""

          case "${GITHUB_EVENT_NAME}" in
            push)
              SHOULD_BUILD="true"
              TARGET_TAG="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              SHOULD_BUILD="true"
              if [ -n "${INPUT_TAG}" ]; then
                TARGET_TAG="${INPUT_TAG}"
              else
                TARGET_TAG="${UPSTREAM_TAG}"
              fi
              ;;
            *)
              # 定时任务 (schedule)：对比最新 Release 中记录的 Upstream Commit SHA
              if [[ "${LAST_BODY}" == *"${UPSTREAM_SHA}"* ]]; then
                echo "上游源码 (${UPSTREAM_SHA}) 相比上次发布未发生变化，跳过本次构建。"
                SHOULD_BUILD="false"
              else
                echo "发现上游源码更新 (${UPSTREAM_SHA})，开始自动编译构建！"
                SHOULD_BUILD="true"

                # 若本仓库尚未发布过该上游 Tag (如 v5.5.0)，则直接使用该 Tag
                if ! gh release view "${UPSTREAM_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                  TARGET_TAG="${UPSTREAM_TAG}"
                else
                  # 若上游仅更新了源码但未打新 Tag，则在当前最新版本号基础上自动 +1 (如 v5.5.0 -> v5.5.1)
                  BASE_VER="${LAST_TAG#v}"
                  if [ -z "${BASE_VER}" ]; then
                    BASE_VER="${UPSTREAM_TAG#v}"
                  fi
                  MAJOR=$(echo "${BASE_VER}" | cut -d. -f1)
                  MINOR=$(echo "${BASE_VER}" | cut -d. -f2)
                  PATCH=$(echo "${BASE_VER}" | cut -d. -f3)
                  PATCH=$((${PATCH:-0} + 1 ))
                  TARGET_TAG="v${MAJOR}.${MINOR}.${PATCH}"
                fi
              fi
              ;;
          esac

          # 统一确保 Tag 以 v 开头且为 vX.Y.Z 格式
          if [[ "${TARGET_TAG}" != v* ]]; then
            TARGET_TAG="v${TARGET_TAG}"
          fi
          if [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            TARGET_TAG="${TARGET_TAG}.0"
          fi

          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT
          echo "release_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
          echo "判定结果 -> should_build: ${SHOULD_BUILD}, release_tag:${TARGET_TAG}"

  # ==========================================
  # 阶段 2：并行编译 amd64 / arm64 / arm32 静态二进制
  # ==========================================
  build:
    name: Build (${{ matrix.arch_label }} /${{ matrix.arch_name }})
    needs: sync-and-check
    if: needs.sync-and-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: amd64
            arch_name: x86_64
            platform: linux/amd64
          - arch_label: arm64
            arch_name: aarch64
            platform: linux/arm64
          - arch_label: arm32
            arch_name: arm
            platform: linux/arm/v7

    steps:
      - name: Checkout Latest Upstream Source (with Submodules)
        uses: actions/checkout@v4
        with:
          repository: proot-me/proot
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Compile Static PRoot (${{ matrix.arch_label }})
        env:
          RELEASE_TAG: ${{ needs.sync-and-check.outputs.release_tag }}
          ARCH_NAME: ${{ matrix.arch_name }}
        run: |
          BIN_NAME="proot-${RELEASE_TAG}-${ARCH_NAME}-static"
          CLEAN_VER="${RELEASE_TAG#v}"

          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            alpine:3.20 sh -euxc "
              # 1. 安装静态编译工具链与依赖头文件
              apk update
              apk add --no-cache \
                build-base \
                talloc-dev \
                talloc-static \
                bsd-compat-headers \
                linux-headers \
                uthash-dev \
                git \
                coreutils \
                file

              git config --global --add safe.directory '*'
              make -C src clean || true

              # 2. 将当前发布版本号写入 GNUmakefile，确保 proot --version 显示一致
              sed -i 's/^VERSION.*/VERSION = ${CLEAN_VER}/g' src/GNUmakefile || true

              # 3. 注入编译参数：
              #    -fomit-frame-pointer: 解决 arm32 (armv7) 下 r7 寄存器冲突
              #    -Wno-error: 避免高版本编译器警告中断构建
              #    -static -ltalloc: 强制纯静态链接
              sed -i '/CFLAGS.*+=/a CFLAGS += -fomit-frame-pointer -Wno-error' src/GNUmakefile
              sed -i 's/-ltalloc/-static -ltalloc/g' src/GNUmakefile

              # 4. 编译 PRoot
              make -C src V=1 proot

              # 5. Strip 剥离符号减小体积并导出
              strip src/proot
              cp src/proot ./${BIN_NAME}
              chmod +x ./${BIN_NAME}

              # 6. 验证产物类型与版本信息
              file ./${BIN_NAME}
              ./${BIN_NAME} --version
            "

      - name: Upload Artifact (${{ matrix.arch_label }})
        uses: actions/upload-artifact@v4
        with:
          name: proot-bin-${{ matrix.arch_label }}
          path: proot-${{ needs.sync-and-check.outputs.release_tag }}-${{ matrix.arch_name }}-static
          if-no-files-found: error

  # ==========================================
  # 阶段 3：打包校验并自动发布到 Releases (标记为 Latest)
  # ==========================================
  release:
    name: Publish Release (${{ needs.sync-and-check.outputs.release_tag }})
    needs: [sync-and-check, build]
    if: needs.sync-and-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          chmod +x proot-*
          sha256sum proot-* > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Create Tag & Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync-and-check.outputs.release_tag }}
          target_commitish: master
          name: PRoot ${{ needs.sync-and-check.outputs.release_tag }} (Multi-Arch Static)
          # 强制将最新发布的版本标记为 Latest
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 🚀 PRoot ${{ needs.sync-and-check.outputs.release_tag }} 多架构纯静态编译版 (musl-libc)

            基于上游官方仓库 [`proot-me/proot`](https://github.com/proot-me/proot) 最新源码自动同步构建，零外部动态库依赖，支持在受限容器环境下直接运行。

            * **Upstream Commit**: `${{ needs.sync-and-check.outputs.upstream_sha }}` (${{ needs.sync-and-check.outputs.upstream_date }})
            * **Build Environment**: Alpine Linux (`musl-libc` + `talloc-static`)

            ---

            #### 📦 架构与文件对照表

            | 架构简称 | 标准架构名 | 适用设备 / 平台 | 编译产物文件名 |
            | :--- | :--- | :--- | :--- |
            | **`amd64`** | `x86_64` | PC / 服务器 / 云容器 (Intel / AMD 64位) | `proot-${{ needs.sync-and-check.outputs.release_tag }}-x86_64-static` |
            | **`arm64`** | `aarch64` | ARMv8 / ARM64 服务器、盒子、树莓派 4/5、手机 Termux | `proot-${{ needs.sync-and-check.outputs.release_tag }}-aarch64-static` |
            | **`arm32`** | `arm` (`armv7l`) | 玩客云 (OneCloud) 等 32位 ARMv7 / armhf 设备 | `proot-${{ needs.sync-and-check.outputs.release_tag }}-arm-static` |
          files: |
            dist/proot-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
