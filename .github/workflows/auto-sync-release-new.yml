name: Auto Sync & Build Multi-Arch PRoot New Test

on:
  # 1. 每月 1 号 UTC 02:28 (北京时间 10:28) 自动拉取同步上游并编译构建
  schedule:
    - cron: '28 2 1 * *'

  # 2. 手动触发：支持指定版本 Tag (如 v5.5.0) 立即按上游原版逻辑构建并覆盖发布
  workflow_dispatch:
    inputs:
      release_tag:
        description: '指定发布的版本 Tag (留空则自动使用上游最新 Tag，如 v5.5.0)'
        required: false
        default: 'v5.5.0'
      force_build:
        description: '是否强制重新编译并覆盖已存在的同名 Release 资产'
        type: boolean
        default: true

  # 3. 推送 v* 标签时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: proot-multiarch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 阶段 1：同步上游最新源码 & 确定版本标签
  # ==========================================
  sync-and-check:
    name: Sync Upstream & Check Version
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.check.outputs.upstream_short_sha }}
      upstream_date: ${{ steps.check.outputs.upstream_date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Upstream & Select Release Tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -e

          # 1. 读取本仓库当前最新 Release 信息
          LATEST_RELEASE_JSON=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName,body 2>/dev/null || echo "{}")
          LAST_TAG=$(echo "${LATEST_RELEASE_JSON}" | jq -r '.tagName // empty')
          LAST_BODY=$(echo "${LATEST_RELEASE_JSON}" | jq -r '.body // empty')
          echo "当前本仓库最新 Release Tag: ${LAST_TAG:-无}"

          # 2. 拉取上游 proot-me/proot 最新源码与标签
          git remote add upstream https://github.com/proot-me/proot.git 2>/dev/null || true
          git fetch upstream master --tags --force

          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          UPSTREAM_FULL_SHA=$(git rev-parse upstream/master)
          UPSTREAM_DATE=$(git log -1 --format=%cs upstream/master)
          echo "upstream_sha=${UPSTREAM_FULL_SHA}" >> $GITHUB_OUTPUT
          echo "upstream_short_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          echo "upstream_date=${UPSTREAM_DATE}" >> $GITHUB_OUTPUT
          echo "上游最新 Commit: ${UPSTREAM_FULL_SHA} (${UPSTREAM_DATE})"

          # 3. 获取上游最新正式版 Tag (如 v5.5.0)
          UPSTREAM_TAG=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n 1 || true)
          if [ -z "${UPSTREAM_TAG}" ]; then
            UPSTREAM_TAG="v5.5.0"
          fi
          if [[ "${UPSTREAM_TAG}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            UPSTREAM_TAG="${UPSTREAM_TAG}.0"
          fi
          echo "上游最新正式版 Tag: ${UPSTREAM_TAG}"

          # 4. 尝试自动同步本仓库 master 分支
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout master 2>/dev/null || git checkout -b master
            if git merge upstream/master --no-edit; then
              git push origin master 2>/dev/null || echo "提示: 跳过分支推送，直接基于上游 commit 构建"
            else
              git merge --abort 2>/dev/null || true
            fi
          fi

          # 5. 判定构建与目标 Tag
          SHOULD_BUILD="false"
          TARGET_TAG=""

          case "${GITHUB_EVENT_NAME}" in
            push)
              SHOULD_BUILD="true"
              TARGET_TAG="${GITHUB_REF_NAME}"
              ;;
            workflow_dispatch)
              SHOULD_BUILD="true"
              if [ -n "${INPUT_TAG}" ]; then
                TARGET_TAG="${INPUT_TAG}"
              else
                TARGET_TAG="${UPSTREAM_TAG}"
              fi
              ;;
            *)
              # 定时任务 (schedule)：对比上游 Commit SHA 是否已构建发布
              if [[ "${LAST_BODY}" == *"${UPSTREAM_SHA}"* ]] && [ "${FORCE_BUILD}" != "true" ]; then
                echo "上游源码 (${UPSTREAM_SHA}) 未发生变化，跳过本次构建。"
                SHOULD_BUILD="false"
              else
                echo "检测到上游更新 (${UPSTREAM_SHA})，准备开始构建！"
                SHOULD_BUILD="true"
                if ! gh release view "${UPSTREAM_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                  TARGET_TAG="${UPSTREAM_TAG}"
                else
                  BASE_VER="${LAST_TAG#v}"
                  if [ -z "${BASE_VER}" ]; then
                    BASE_VER="${UPSTREAM_TAG#v}"
                  fi
                  MAJOR=$(echo "${BASE_VER}" | cut -d. -f1)
                  MINOR=$(echo "${BASE_VER}" | cut -d. -f2)
                  PATCH=$(echo "${BASE_VER}" | cut -d. -f3)
                  PATCH=$(( ${PATCH:-0} + 1 ))
                  TARGET_TAG="v${MAJOR}.${MINOR}.${PATCH}"
                fi
              fi
              ;;
          esac

          if [[ "${TARGET_TAG}" != v* ]]; then
            TARGET_TAG="v${TARGET_TAG}"
          fi
          if [[ "${TARGET_TAG}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            TARGET_TAG="${TARGET_TAG}.0"
          fi

          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT
          echo "release_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
          echo "最终判定 -> should_build: ${SHOULD_BUILD}, release_tag: ${TARGET_TAG}"

  # ==========================================
  # 阶段 2：100% 采用上游 release.yml 原版逻辑编译 (Ubuntu 24.04 glibc + 不 strip)
  # ==========================================
  build:
    name: Build (${{ matrix.arch_label }} / ${{ matrix.arch_name }})
    needs: sync-and-check
    if: needs.sync-and-check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: amd64
            arch_name: x86_64
            platform: linux/amd64
          - arch_label: arm64
            arch_name: aarch64
            platform: linux/arm64
          - arch_label: arm32
            arch_name: arm
            platform: linux/arm/v7

    steps:
      - name: Checkout Exact Upstream Source
        uses: actions/checkout@v7
        with:
          repository: proot-me/proot
          ref: ${{ needs.sync-and-check.outputs.upstream_sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU (for arm64 & arm32)
        if: matrix.arch_label != 'amd64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      # 1. amd64 架构：直接在 ubuntu-24.04 宿主机上 100% 原样执行上游 release.yml 的命令
      - name: Build amd64 (Exact Upstream release.yml Method)
        if: matrix.arch_label == 'amd64'
        env:
          RELEASE_TAG: ${{ needs.sync-and-check.outputs.release_tag }}
          ARCH_NAME: ${{ matrix.arch_name }}
        run: |
          set -eux
          BIN_NAME="proot-${RELEASE_TAG}-${ARCH_NAME}-static"

          sudo apt-get update -qq
          sudo apt-get install -qq libarchive-dev libtalloc-dev pkg-config uthash-dev lzop g++

          make -C src clean loader.elf loader-m32.elf build.h WITHOUT_PYTHON=1
          LDFLAGS="${LDFLAGS:-} -static" make -C src proot WITHOUT_PYTHON=1

          cp src/proot "./${BIN_NAME}"
          chmod 755 "./${BIN_NAME}"

      # 2. arm64 / arm32 架构：在同源 Ubuntu 24.04 (glibc) 环境中按上游 release.yml 逻辑编译
      - name: Build arm64 & arm32 (Ubuntu glibc Upstream Method)
        if: matrix.arch_label != 'amd64'
        env:
          RELEASE_TAG: ${{ needs.sync-and-check.outputs.release_tag }}
          ARCH_NAME: ${{ matrix.arch_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH_LABEL: ${{ matrix.arch_label }}
        run: |
          set -eux
          BIN_NAME="proot-${RELEASE_TAG}-${ARCH_NAME}-static"

          EXTRA_CFLAGS=""
          if [ "${ARCH_LABEL}" = "arm32" ]; then
            EXTRA_CFLAGS="-fomit-frame-pointer"
          fi

          docker run --rm --platform "${PLATFORM}" \
            -e "EXTRA_CFLAGS=${EXTRA_CFLAGS}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            ubuntu:24.04 bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq build-essential git libarchive-dev libtalloc-dev pkg-config uthash-dev lzop g++ file

              git config --global --add safe.directory /workspace

              CFLAGS="${EXTRA_CFLAGS}" make -C src clean loader.elf build.h WITHOUT_PYTHON=1
              CFLAGS="${EXTRA_CFLAGS}" LDFLAGS="${LDFLAGS:-} -static" make -C src proot WITHOUT_PYTHON=1
            '

          cp src/proot "./${BIN_NAME}"
          chmod 755 "./${BIN_NAME}"

      # 3. 校验编译产物属性与文件体积 (> 1MB)
      - name: Verify Binary Size (> 1MB) & Version
        env:
          RELEASE_TAG: ${{ needs.sync-and-check.outputs.release_tag }}
          ARCH_NAME: ${{ matrix.arch_name }}
        run: |
          set -e
          BIN_NAME="proot-${RELEASE_TAG}-${ARCH_NAME}-static"
          ls -lh "./${BIN_NAME}"
          file "./${BIN_NAME}"
          "./${BIN_NAME}" --version

          FILE_SIZE=$(stat -c%s "./${BIN_NAME}")
          echo "编译产物字节大小: ${FILE_SIZE} bytes"
          if [ "${FILE_SIZE}" -lt 1000000 ]; then
            echo "::error::编译产物 ${BIN_NAME} 体积异常 (${FILE_SIZE} bytes < 1MB)！"
            exit 1
          fi

      - name: Upload Artifact (${{ matrix.arch_label }})
        uses: actions/upload-artifact@v7
        with:
          name: proot-bin-${{ matrix.arch_label }}
          path: proot-${{ needs.sync-and-check.outputs.release_tag }}-${{ matrix.arch_name }}-static
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 阶段 3：打包校验并发布双语 Release (标记为 Latest)
  # ==========================================
  release:
    name: Publish Release (${{ needs.sync-and-check.outputs.release_tag }})
    needs: [sync-and-check, build]
    if: needs.sync-and-check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Compiled Binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          chmod 755 proot-*
          sha256sum proot-* > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Create or Update GitHub Release (Latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync-and-check.outputs.release_tag }}
          target_commitish: master
          name: PRoot ${{ needs.sync-and-check.outputs.release_tag }} (Multi-Arch Static)
          make_latest: true
          overwrite_files: true
          draft: false
          prerelease: false
          body: |
            ### 🌍 English — PRoot ${{ needs.sync-and-check.outputs.release_tag }} Multi-Arch Static Build (Ubuntu glibc)

            Strictly built using the official [`proot-me/proot`](https://github.com/proot-me/proot) `release.yml` workflow logic on **Ubuntu 24.04 LTS** (`glibc` + `libtalloc` static linking, unstripped with full symbol tables). Ready to run out-of-the-box on any Linux host or restricted container without root privileges.

            * **Upstream Repository**: [`proot-me/proot`](https://github.com/proot-me/proot)
            * **Upstream Commit**: `${{ needs.sync-and-check.outputs.upstream_sha }}` (${{ needs.sync-and-check.outputs.upstream_date }})
            * **Build Environment**: Ubuntu 24.04 LTS (`glibc` static, unstripped)

            #### 📦 Architecture & Binary Assets

            | Arch Alias | Target | Supported Devices / Platforms | Binary Filename |
            | :--- | :--- | :--- | :--- |
            | **`amd64`** | `x86_64` | PC / Cloud Servers / Containers (Intel / AMD 64-bit) | `proot-${{ needs.sync-and-check.outputs.release_tag }}-x86_64-static` |
            | **`arm64`** | `aarch64` | ARMv8 / ARM64 Servers, SBCs, Raspberry Pi 4/5, Android Termux | `proot-${{ needs.sync-and-check.outputs.release_tag }}-aarch64-static` |
            | **`arm32`** | `arm` (`armv7l`) | OneCloud (玩客云) & 32-bit ARMv7 / armhf Embedded Devices | `proot-${{ needs.sync-and-check.outputs.release_tag }}-arm-static` |

            ---

            ### 🇨🇳 简体中文 — PRoot ${{ needs.sync-and-check.outputs.release_tag }} 多架构官方原版静态构建 (Ubuntu glibc)

            严格采用上游官方仓库 [`proot-me/proot`](https://github.com/proot-me/proot) 的 `release.yml` 原版构建流程，基于 **Ubuntu 24.04 LTS** (`glibc` + `libtalloc`) 纯静态编译，保留完整调试符号表（未 `strip`），零外部动态库依赖，支持在无 root 权限或受限容器环境下开箱即用。

            * **上游源码仓库**: [`proot-me/proot`](https://github.com/proot-me/proot)
            * **上游 Commit**: `${{ needs.sync-and-check.outputs.upstream_sha }}` (${{ needs.sync-and-check.outputs.upstream_date }})
            * **编译构建环境**: Ubuntu 24.04 LTS (`glibc` static, unstripped)

            #### 📦 架构与文件对照表

            | 架构简称 | 标准架构名 | 适用设备 / 平台 | 编译产物文件名 |
            | :--- | :--- | :--- | :--- |
            | **`amd64`** | `x86_64` | PC / 服务器 / 云容器 (Intel / AMD 64位) | `proot-${{ needs.sync-and-check.outputs.release_tag }}-x86_64-static` |
            | **`arm64`** | `aarch64` | ARMv8 / ARM64 服务器、电视盒子、树莓派 4/5、手机 Termux | `proot-${{ needs.sync-and-check.outputs.release_tag }}-aarch64-static` |
            | **`arm32`** | `arm` (`armv7l`) | 玩客云 (OneCloud) 等 32位 ARMv7 / armhf 嵌入式设备 | `proot-${{ needs.sync-and-check.outputs.release_tag }}-arm-static` |

            > 💡 **Verification / 校验说明**: Checksums for all binaries are available in `SHA256SUMS`. / 所有二进制文件的校验和均包含在 `SHA256SUMS` 文件中。
          files: |
            dist/proot-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
